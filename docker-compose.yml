# version: '3.8'

services:
  backend:
    build: .
    container_name: snapguide-api-server
    ports:
      - "8082:8080"
    # .env 파일에 정의된 변수들을 컨테이너 환경 변수로 주입합니다.
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE} # 여기서 프로필 선택
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION}
      - REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CLOUD_AWS_CREDENTIALS_ACCESS-KEY=${AWS_ACCESS_KEY_ID}
      - CLOUD_AWS_CREDENTIALS_SECRET-KEY=${AWS_SECRET_ACCESS_KEY}
      - CLOUD_AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - CLOUD_AWS_REGION_STATIC=${AWS_REGION}
      # OpenTelemetry 설정
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME}
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    # 호스트-컨테이너 간 디렉토리 연결 (파일 경로 문제 해결)
    # 내 Mac의 ./uploads 폴더와 컨테이너의 /app/uploads 폴더를 연결
    volumes:
      - ./uploads:/app/uploads
      - ./opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar
    depends_on:
      db:
        condition: service_healthy # 'db' 서비스가 'healthy' 상태가 될 때까지 기다림
      redis:
        condition: service_started # redis는 빠르게 시작되므로 기존 방식 유지
      otel-collector:
        condition: service_started
    networks:
      - my-network

  db:
    image: postgis/postgis:15-3.4-alpine # 👈 PostGIS가 포함된 이미지로 변경
    container_name: snapguide-postgres-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432" # 기존 5432:5432는 5432번 포트를 사용하려고 해서 충돌 발생 내 컴퓨터의 5435번 포트와 컨테이너의 5432번 포트를 연결
    networks:
      - my-network

  redis:
    image: redis:7-alpine
    container_name: snapguide-redis-cache
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - my-network
    # maxmemory: 최대 512MB까지만 사용
    # allkeys-lru: 메모리 가득 차면 오래된 키 자동 삭제
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru


  # OpenTelemetry Collector - 텔레메트리 데이터 수집 및 라우팅
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: snapguide-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "127.0.0.1:4328:4318"   # OTLP HTTP receiver
      - "127.0.0.1:4327:4317"   # OTLP gRPC receiver
      - "127.0.0.1:8889:8889"   # Prometheus metrics exporter
    networks:
      - my-network

  # Tempo - 분산 추적(Traces) 저장소
  tempo:
    image: grafana/tempo:2.4.0
    container_name: snapguide-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo query frontend
      - "4319:4317"   # OTLP gRPC
    networks:
      - my-network

  # Loki - 로그 집계 시스템
  loki:
    image: grafana/loki:2.9.0
    container_name: snapguide-loki
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - my-network

  # Promtail - 로그 수집기 (컨테이너 로그를 Loki로 전송)
  promtail:
    image: grafana/promtail:2.9.0
    container_name: snapguide-promtail
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - my-network

  # Prometheus - 메트릭 저장소
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: snapguide-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - my-network

  # Grafana - 통합 관측 대시보드
  grafana:
    image: grafana/grafana:10.3.0
    container_name: snapguide-grafana
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - my-network

volumes:
  postgres_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  my-network: