# Common configuration for all profiles
spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  web:
    resources:
      static-locations:
        - classpath:/static/

  application:
    name: snapguide-backend

# Spring Boot Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health   # FAIL fix: health만 공개 (metrics/prometheus는 ADMIN만)
  endpoint:
    health:
      show-details: when-authorized  # FAIL fix: always → when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# Swagger/OpenAPI Documentation
springdoc:
  swagger-ui:
    groups-order: desc
    tags-sorter: alpha
    operations-sorter: method
    default-model-expand-depth: 2
    display-request-duration: true
    default-models-expand-depth: 2

  api-docs:
    path: /api-docs

  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-and-view-allowed: true
  paths-to-match:
    - /api/**

# Rate Limiting (Redis 기반 — 로그인/회원가입 Brute Force 방어)
snapguide:
  rate-limit:
    login-limit: 10       # 로그인: IP 기준 10회/10분
    signup-limit: 5       # 회원가입: IP 기준 5회/10분
    feed-limit: 120       # 공개 피드: IP 기준 120회/10분
    window-seconds: 600   # 10분 윈도우
  # 신뢰 프록시(nginx-ingress 등)의 IP/CIDR에서 온 요청만 X-Forwarded-For 헤더를 신뢰.
  # 그렇지 않으면 모든 요청이 동일한 프록시 pod IP로 보여 IP 기반 rate limit이 전역 단일 버킷이 되거나,
  # 헤더 위조로 우회될 수 있음.
  trusted-proxy-ips: ${TRUSTED_PROXY_IPS:127.0.0.1,::1}

# PWA Push Notification (VAPID)
pwa:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@snapguide.com}

admin:
  email: ${ADMIN_EMAIL:admin@snapguide.local}
  password:
    bcrypt: ${ADMIN_PASSWORD_BCRYPT:$2a$10$placeholder-must-be-overridden-in-prod}

console:
  # lab.mungji 콘솔 집계용 서비스 토큰. 미설정 시 /api/internal/** 전부 차단(fail-closed).
  internal-token: ${CONSOLE_INTERNAL_TOKEN:}

lab:
  feedback:
    endpoint: ${LAB_FEEDBACK_ENDPOINT:http://lab-dashboard.lab.svc.cluster.local/api/internal/feedback}
    token: ${LAB_FEEDBACK_TOKEN:}
    app-name: snapguide

logging:
  level:
    io.micrometer.registry.otlp: ERROR

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 15m
      cookie:
        http-only: true
        secure: true
        same-site: strict
