<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapguide 관리자 페이지</title>
    <style>
        body { visibility: hidden; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #22263a;
            --border: #2e3350;
            --accent: #6c63ff;
            --accent-hover: #5a52d5;
            --danger: #e05252;
            --danger-hover: #c73e3e;
            --success: #4caf7d;
            --text: #e8eaf0;
            --text-secondary: #9ba3c0;
            --text-muted: #6b7494;
            --sidebar-w: 220px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* ─── SIDEBAR ─── */
        #sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
        }

        .logo {
            padding: 20px 18px 16px;
            font-size: 17px;
            font-weight: 700;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.5px;
        }

        .logo span { color: var(--text); font-weight: 400; font-size: 13px; margin-left: 6px; }

        nav { padding: 12px 0; flex: 1; }

        .nav-section {
            padding: 10px 18px 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            cursor: pointer;
        }

        nav a:hover { color: var(--text); background: var(--surface2); }

        nav a.active {
            color: var(--accent);
            background: rgba(108,99,255,0.1);
            border-left-color: var(--accent);
            font-weight: 600;
        }

        nav a .icon { font-size: 16px; width: 20px; text-align: center; }

        /* ─── MAIN ─── */
        #main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title { font-size: 18px; font-weight: 600; }
        .header-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

        .token-section { display: flex; gap: 10px; align-items: center; }

        input[type="text"], input[type="password"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            width: 260px;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        input::placeholder { color: var(--text-muted); }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover { background: var(--accent-hover); }

        button.danger { background: var(--danger); }
        button.danger:hover { background: var(--danger-hover); }

        button.ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        button.ghost:hover { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,0.08); }

        button.sm { padding: 5px 10px; font-size: 12px; }

        /* ─── CONTENT ─── */
        #content { padding: 28px; flex: 1; }

        .page { display: none; }
        .page.active { display: block; }

        /* ─── STAT CARDS ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .stat-value {
            font-size: 30px;
            font-weight: 700;
            color: var(--text);
            margin-top: 8px;
        }

        .stat-icon { font-size: 22px; margin-bottom: 6px; }

        /* ─── TABLE ─── */
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-title { font-size: 15px; font-weight: 600; color: var(--text); }

        table { width: 100%; border-collapse: collapse; }

        thead tr { background: var(--surface2); }

        th {
            padding: 11px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr:hover { background: rgba(255,255,255,0.025); }

        /* badges */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-admin { background: rgba(108,99,255,0.2); color: #a39eff; }
        .badge-member { background: rgba(100,180,100,0.15); color: #7ecb8e; }
        .badge-google { background: rgba(66,133,244,0.15); color: #7ab3f5; }
        .badge-kakao { background: rgba(254,229,0,0.15); color: #d4bc00; }
        .badge-local { background: rgba(160,160,160,0.15); color: #b0b0b0; }

        /* ─── PAGINATION ─── */
        .pagination {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
        }

        .pagination-info { font-size: 13px; color: var(--text-secondary); }

        .pagination-btns { display: flex; gap: 6px; }

        .pagination-btns button { padding: 6px 12px; font-size: 13px; }

        .pagination-btns button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            background: var(--surface2);
            color: var(--text-muted);
        }

        /* ─── ROLE MODAL ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            width: 360px;
        }

        .modal h3 { font-size: 16px; margin-bottom: 6px; }
        .modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }

        .modal select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal select:focus { outline: none; border-color: var(--accent); }

        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

        /* ─── EMPTY / LOADING ─── */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }

        /* ─── TOAST ─── */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 200;
            max-width: 320px;
        }

        #toast.show { opacity: 1; }
        #toast.success { border-color: var(--success); }
        #toast.error { border-color: var(--danger); }

        /* truncate long text */
        .trunc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<div id="sidebar">
    <div class="logo">Snapguide <span>Admin</span></div>
    <nav>
        <div class="nav-section">메인</div>
        <a class="active" onclick="showPage('dashboard')" data-page="dashboard">
            <span class="icon">📊</span> 대시보드
        </a>
        <div class="nav-section">콘텐츠 관리</div>
        <a onclick="showPage('members')" data-page="members">
            <span class="icon">👥</span> 회원 관리
        </a>
        <a onclick="showPage('guides')" data-page="guides">
            <span class="icon">📸</span> 게시글 관리
        </a>
        <a onclick="showPage('comments')" data-page="comments">
            <span class="icon">💬</span> 게시판 관리
        </a>
        <a onclick="showPage('locations')" data-page="locations">
            <span class="icon">🗺️</span> 대학별 데이터 관리
        </a>
    </nav>
</div>

<!-- ── MAIN ── -->
<div id="main">
    <header>
        <div>
            <div class="header-title" id="headerTitle">대시보드</div>
            <div class="header-sub" id="headerSub">전체 현황을 확인하세요</div>
        </div>
        <div class="token-section">
            <button class="ghost" onclick="adminLogout()">로그아웃</button>
        </div>
    </header>

    <div id="content">

        <!-- ── DASHBOARD ── -->
        <div id="page-dashboard" class="page active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-label">총 회원 수</div>
                    <div class="stat-value" id="stat-members">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📸</div>
                    <div class="stat-label">총 게시글 수</div>
                    <div class="stat-value" id="stat-guides">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🗺️</div>
                    <div class="stat-label">등록 위치 수</div>
                    <div class="stat-value" id="stat-locations">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💬</div>
                    <div class="stat-label">총 댓글 수</div>
                    <div class="stat-value" id="stat-comments">-</div>
                </div>
            </div>
            <div style="color: var(--text-secondary); font-size: 13px; padding: 8px 0;">
                ※ 좌측 메뉴에서 데이터를 확인하세요.
            </div>
        </div>

        <!-- ── MEMBERS ── -->
        <div id="page-members" class="page">
            <div class="table-wrap">
                <div class="table-header">
                    <div class="table-title">회원 목록</div>
                    <button class="ghost sm" onclick="loadMembers(0)">새로고침</button>
                </div>
                <div id="members-body"><div class="loading">데이터를 불러오는 중...</div></div>
                <div class="pagination" id="members-pagination" style="display:none">
                    <div class="pagination-info" id="members-page-info"></div>
                    <div class="pagination-btns">
                        <button id="members-prev" onclick="loadMembers(membersPage - 1)">← 이전</button>
                        <button id="members-next" onclick="loadMembers(membersPage + 1)">다음 →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── GUIDES ── -->
        <div id="page-guides" class="page">
            <div class="table-wrap">
                <div class="table-header">
                    <div class="table-title">게시글 목록</div>
                    <button class="ghost sm" onclick="loadGuides(0)">새로고침</button>
                </div>
                <div id="guides-body"><div class="loading">데이터를 불러오는 중...</div></div>
                <div class="pagination" id="guides-pagination" style="display:none">
                    <div class="pagination-info" id="guides-page-info"></div>
                    <div class="pagination-btns">
                        <button id="guides-prev" onclick="loadGuides(guidesPage - 1)">← 이전</button>
                        <button id="guides-next" onclick="loadGuides(guidesPage + 1)">다음 →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── COMMENTS ── -->
        <div id="page-comments" class="page">
            <div class="table-wrap">
                <div class="table-header">
                    <div class="table-title">댓글(게시판) 목록</div>
                    <button class="ghost sm" onclick="loadComments(0)">새로고침</button>
                </div>
                <div id="comments-body"><div class="loading">데이터를 불러오는 중...</div></div>
                <div class="pagination" id="comments-pagination" style="display:none">
                    <div class="pagination-info" id="comments-page-info"></div>
                    <div class="pagination-btns">
                        <button id="comments-prev" onclick="loadComments(commentsPage - 1)">← 이전</button>
                        <button id="comments-next" onclick="loadComments(commentsPage + 1)">다음 →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── LOCATIONS ── -->
        <div id="page-locations" class="page">
            <div class="table-wrap">
                <div class="table-header">
                    <div class="table-title">위치 데이터 목록</div>
                    <button class="ghost sm" onclick="loadLocations(0)">새로고침</button>
                </div>
                <div id="locations-body"><div class="loading">데이터를 불러오는 중...</div></div>
                <div class="pagination" id="locations-pagination" style="display:none">
                    <div class="pagination-info" id="locations-page-info"></div>
                    <div class="pagination-btns">
                        <button id="locations-prev" onclick="loadLocations(locationsPage - 1)">← 이전</button>
                        <button id="locations-next" onclick="loadLocations(locationsPage + 1)">다음 →</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ── ROLE MODAL ── -->
<div class="modal-overlay" id="roleModal">
    <div class="modal">
        <h3>역할 변경</h3>
        <p id="roleModalDesc">회원의 역할을 변경합니다.</p>
        <select id="roleSelect">
            <option value="MEMBER">MEMBER</option>
            <option value="ADMIN">ADMIN</option>
        </select>
        <div class="modal-actions">
            <button class="ghost" onclick="closeRoleModal()">취소</button>
            <button onclick="submitRoleChange()">저장</button>
        </div>
    </div>
</div>

<!-- ── TOAST ── -->
<div id="toast"></div>

<script>
    // ── STATE ──
    let token = localStorage.getItem('accessToken') || '';
    let membersPage = 0, guidesPage = 0, commentsPage = 0, locationsPage = 0;
    let membersTotal = 0, guidesTotal = 0, commentsTotal = 0, locationsTotal = 0;
    let roleTargetId = null;

    const PAGE_SIZE = 20;

    const headers = () => ({
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (localStorage.getItem('accessToken') || '')
    });

    // ── INIT: 인증 및 관리자 권한 확인 ──
    if (!token) {
        window.location.href = '/';
    }

    async function verifyAdminAccess() {
        try {
            const res = await fetch('/api/admin/stats', { headers: headers() });
            if (res.status === 401) {
                // 토큰 만료/무효 → 토큰 삭제 후 로그인 페이지로
                localStorage.removeItem('accessToken');
                window.location.href = '/';
                return;
            }
            if (!res.ok) {
                // 403 등 권한 없음 → 토큰 유지, 메인으로만 이동
                window.location.href = '/';
                return;
            }
            document.body.style.visibility = 'visible';
            loadStats();
        } catch (e) {
            // 네트워크 오류 → 토큰 유지
            window.location.href = '/';
        }
    }
    verifyAdminAccess();

    function adminLogout() {
        const accessToken = localStorage.getItem('accessToken');
        fetch('/api/auth/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest', 'Authorization': 'Bearer ' + accessToken },
            body: JSON.stringify({ accessToken }),
            credentials: 'include',
        }).finally(() => {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('userEmail');
            window.location.href = '/';
        });
    }

    // ── NAVIGATION ──
    const pageHeaders = {
        dashboard:  ['대시보드',          '전체 현황을 확인하세요'],
        members:    ['회원 관리',          '전체 회원 목록 및 역할 관리'],
        guides:     ['게시글 관리',        '등록된 게시글(가이드) 목록 관리'],
        comments:   ['게시판 관리',        '게시판 댓글 목록 관리'],
        locations:  ['대학별 데이터 관리', '등록된 위치 및 캠퍼스 데이터 관리'],
    };

    function showPage(name) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById('page-' + name).classList.add('active');
        document.querySelector(`nav a[data-page="${name}"]`).classList.add('active');
        const [title, sub] = pageHeaders[name];
        document.getElementById('headerTitle').textContent = title;
        document.getElementById('headerSub').textContent = sub;

        if (name === 'dashboard') loadStats();
        if (name === 'members')   loadMembers(0);
        if (name === 'guides')    loadGuides(0);
        if (name === 'comments')  loadComments(0);
        if (name === 'locations') loadLocations(0);
    }

    // ── API HELPER ──
    async function api(path, method = 'GET', body = null) {
        const opts = { method, headers: headers() };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        if (!res.ok) {
            const msg = await res.text().catch(() => res.statusText);
            throw new Error(msg || res.statusText);
        }
        if (res.status === 204) return null;
        return res.json();
    }

    // ── STATS ──
    async function loadStats() {
        try {
            const s = await api('/api/admin/stats');
            document.getElementById('stat-members').textContent = s.totalMembers ?? '-';
            document.getElementById('stat-guides').textContent  = s.totalGuides  ?? '-';
        } catch (e) { /* token not set yet */ }

        // extra counts via list APIs
        try {
            const locs = await api('/api/admin/locations?size=1');
            document.getElementById('stat-locations').textContent = locs.totalElements ?? '-';
        } catch(e) {}
        try {
            const cmts = await api('/api/admin/comments?size=1');
            document.getElementById('stat-comments').textContent = cmts.totalElements ?? '-';
        } catch(e) {}
    }

    // ── MEMBERS ──
    async function loadMembers(page) {
        if (page < 0) return;
        membersPage = page;
        const el = document.getElementById('members-body');
        el.innerHTML = '<div class="loading">불러오는 중...</div>';
        try {
            const data = await api(`/api/admin/members?page=${page}&size=${PAGE_SIZE}`);
            membersTotal = data.totalElements;
            renderMembersTable(data.content);
            renderPagination('members', page, data.totalPages, data.totalElements);
        } catch (e) {
            el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
        }
    }

    function renderMembersTable(rows) {
        const el = document.getElementById('members-body');
        if (!rows.length) {
            el.innerHTML = '<div class="empty-state"><div class="icon">👥</div><p>회원이 없습니다.</p></div>';
            return;
        }
        el.innerHTML = `
        <table>
            <thead><tr>
                <th>ID</th><th>닉네임</th><th>이메일</th><th>제공자</th><th>역할</th><th>가입일</th><th>관리</th>
            </tr></thead>
            <tbody>${rows.map(m => `
            <tr>
                <td><strong>#${m.id}</strong></td>
                <td>${esc(m.nickname ?? '-')}</td>
                <td>${esc(m.email ?? '-')}</td>
                <td>${providerBadge(m.provider)}</td>
                <td>${authorityBadges(m.authority)}</td>
                <td>${fmtDate(m.createdAt)}</td>
                <td><button class="sm" onclick="openRoleModal(${m.id}, '${esc(m.nickname)}', ${JSON.stringify(m.authority)})">역할 변경</button></td>
            </tr>`).join('')}
            </tbody>
        </table>`;
    }

    function providerBadge(p) {
        if (!p) return '<span class="badge badge-local">LOCAL</span>';
        const cls = { GOOGLE: 'badge-google', KAKAO: 'badge-kakao' }[p] || 'badge-local';
        return `<span class="badge ${cls}">${p}</span>`;
    }

    function authorityBadges(auths) {
        if (!auths || !auths.length) return '-';
        return auths.map(a => `<span class="badge ${a === 'ADMIN' ? 'badge-admin' : 'badge-member'}">${a}</span>`).join(' ');
    }

    // ── GUIDES ──
    async function loadGuides(page) {
        if (page < 0) return;
        guidesPage = page;
        const el = document.getElementById('guides-body');
        el.innerHTML = '<div class="loading">불러오는 중...</div>';
        try {
            const data = await api(`/api/admin/guides?page=${page}&size=${PAGE_SIZE}`);
            guidesTotal = data.totalElements;
            renderGuidesTable(data.content);
            renderPagination('guides', page, data.totalPages, data.totalElements);
        } catch (e) {
            el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
        }
    }

    function renderGuidesTable(rows) {
        const el = document.getElementById('guides-body');
        if (!rows.length) {
            el.innerHTML = '<div class="empty-state"><div class="icon">📸</div><p>게시글이 없습니다.</p></div>';
            return;
        }
        el.innerHTML = `
        <table>
            <thead><tr>
                <th>ID</th><th>팁 내용</th><th>작성자</th><th>위치</th><th>좋아요</th><th>미디어</th><th>작성일</th><th>관리</th>
            </tr></thead>
            <tbody>${rows.map(g => `
            <tr>
                <td><strong>#${g.id}</strong></td>
                <td><div class="trunc" title="${esc(g.tip ?? '')}">${esc(g.tip ?? '-')}</div></td>
                <td>${esc(g.authorNickname ?? '-')}</td>
                <td><div class="trunc" title="${esc(g.locationName ?? '')}">${esc(g.locationName ?? '-')}</div></td>
                <td>❤️ ${g.likeCount ?? 0}</td>
                <td>🖼 ${g.mediaCount ?? 0}</td>
                <td>${fmtDate(g.createdAt)}</td>
                <td><button class="sm danger" onclick="deleteGuide(${g.id})">삭제</button></td>
            </tr>`).join('')}
            </tbody>
        </table>`;
    }

    async function deleteGuide(id) {
        if (!confirm(`게시글 #${id}을 삭제하시겠습니까?`)) return;
        try {
            await api(`/api/admin/guides/${id}`, 'DELETE');
            toast('게시글이 삭제되었습니다.', 'success');
            loadGuides(guidesPage);
        } catch (e) { toast('삭제 실패: ' + e.message, 'error'); }
    }

    // ── COMMENTS ──
    async function loadComments(page) {
        if (page < 0) return;
        commentsPage = page;
        const el = document.getElementById('comments-body');
        el.innerHTML = '<div class="loading">불러오는 중...</div>';
        try {
            const data = await api(`/api/admin/comments?page=${page}&size=${PAGE_SIZE}`);
            commentsTotal = data.totalElements;
            renderCommentsTable(data.content);
            renderPagination('comments', page, data.totalPages, data.totalElements);
        } catch (e) {
            el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
        }
    }

    function renderCommentsTable(rows) {
        const el = document.getElementById('comments-body');
        if (!rows.length) {
            el.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>댓글이 없습니다.</p></div>';
            return;
        }
        el.innerHTML = `
        <table>
            <thead><tr>
                <th>ID</th><th>댓글 내용</th><th>작성자</th><th>게시글 ID</th><th>관리</th>
            </tr></thead>
            <tbody>${rows.map(c => `
            <tr>
                <td><strong>#${c.id}</strong></td>
                <td><div class="trunc" title="${esc(c.comment ?? '')}">${esc(c.comment ?? '-')}</div></td>
                <td>${esc(c.authorNickname ?? '-')}</td>
                <td>#${c.guideId ?? '-'}</td>
                <td><button class="sm danger" onclick="deleteComment(${c.id})">삭제</button></td>
            </tr>`).join('')}
            </tbody>
        </table>`;
    }

    async function deleteComment(id) {
        if (!confirm(`댓글 #${id}을 삭제하시겠습니까?`)) return;
        try {
            await api(`/api/admin/comments/${id}`, 'DELETE');
            toast('댓글이 삭제되었습니다.', 'success');
            loadComments(commentsPage);
        } catch (e) { toast('삭제 실패: ' + e.message, 'error'); }
    }

    // ── LOCATIONS ──
    async function loadLocations(page) {
        if (page < 0) return;
        locationsPage = page;
        const el = document.getElementById('locations-body');
        el.innerHTML = '<div class="loading">불러오는 중...</div>';
        try {
            const data = await api(`/api/admin/locations?page=${page}&size=${PAGE_SIZE}`);
            locationsTotal = data.totalElements;
            renderLocationsTable(data.content);
            renderPagination('locations', page, data.totalPages, data.totalElements);
        } catch (e) {
            el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
        }
    }

    function renderLocationsTable(rows) {
        const el = document.getElementById('locations-body');
        if (!rows.length) {
            el.innerHTML = '<div class="empty-state"><div class="icon">🗺️</div><p>위치 데이터가 없습니다.</p></div>';
            return;
        }
        el.innerHTML = `
        <table>
            <thead><tr>
                <th>ID</th><th>장소명</th><th>국가</th><th>지역(Region)</th><th>도시</th><th>주소</th><th>관리</th>
            </tr></thead>
            <tbody>${rows.map(l => `
            <tr>
                <td><strong>#${l.id}</strong></td>
                <td>${esc(l.locationName ?? '-')}</td>
                <td>${esc(l.country ?? '-')}</td>
                <td>${esc(l.region ?? '-')}</td>
                <td>${esc(l.city ?? '-')}</td>
                <td><div class="trunc" title="${esc(l.formattedAddress ?? '')}">${esc(l.formattedAddress ?? '-')}</div></td>
                <td><button class="sm danger" onclick="deleteLocation(${l.id})">삭제</button></td>
            </tr>`).join('')}
            </tbody>
        </table>`;
    }

    async function deleteLocation(id) {
        if (!confirm(`위치 #${id}을 삭제하시겠습니까?\n연결된 게시글에 영향을 줄 수 있습니다.`)) return;
        try {
            await api(`/api/admin/locations/${id}`, 'DELETE');
            toast('위치가 삭제되었습니다.', 'success');
            loadLocations(locationsPage);
        } catch (e) { toast('삭제 실패: ' + e.message, 'error'); }
    }

    // ── ROLE MODAL ──
    function openRoleModal(id, nickname, authorities) {
        roleTargetId = id;
        document.getElementById('roleModalDesc').textContent = `#${id} ${nickname} 회원의 역할을 변경합니다.`;
        const sel = document.getElementById('roleSelect');
        sel.value = (authorities && authorities.includes('ADMIN')) ? 'ADMIN' : 'MEMBER';
        document.getElementById('roleModal').classList.add('open');
    }

    function closeRoleModal() {
        document.getElementById('roleModal').classList.remove('open');
        roleTargetId = null;
    }

    async function submitRoleChange() {
        const role = document.getElementById('roleSelect').value;
        try {
            await api(`/api/admin/members/${roleTargetId}/role`, 'PATCH', { authority: [role] });
            toast('역할이 변경되었습니다.', 'success');
            closeRoleModal();
            loadMembers(membersPage);
        } catch (e) { toast('변경 실패: ' + e.message, 'error'); }
    }

    // ── PAGINATION ──
    function renderPagination(key, page, totalPages, totalElements) {
        const pag = document.getElementById(`${key}-pagination`);
        const info = document.getElementById(`${key}-page-info`);
        const prev = document.getElementById(`${key}-prev`);
        const next = document.getElementById(`${key}-next`);
        pag.style.display = 'flex';
        info.textContent = `${page + 1} / ${totalPages} 페이지 (총 ${totalElements}건)`;
        prev.disabled = page <= 0;
        next.disabled = page >= totalPages - 1;
    }

    // ── UTILS ──
    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDate(d) {
        if (!d) return '-';
        return new Date(d).toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' });
    }

    let toastTimer;
    function toast(msg, type = 'default') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'show ' + type;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = ''; }, 3000);
    }

    // Close modal on overlay click
    document.getElementById('roleModal').addEventListener('click', function(e) {
        if (e.target === this) closeRoleModal();
    });

</script>
</body>
</html>
