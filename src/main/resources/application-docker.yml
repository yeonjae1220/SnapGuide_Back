## Docker/Production Environment Settings ##
spring:
  config:
    activate:
      on-profile: "docker"

  myapp:
    frontend-redirect-url: ${FRONTEND_REDIRECT_URL:https://snapguide.mungji.com}
    app-redirect-uri: com.yeonjae.snapguide://oauth/callback

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SnapguideHikariPool
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:/app/uploads/

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://snapguide.mungji.com}

jwt:
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION}
  secret: ${JWT_SECRET}

google:
  maps:
    api:
      key: ${GOOGLE_MAPS_API_KEY}

storage:
  type: s3
  local:
    base-dir: /app/uploads/

logging:
  level:
    root: INFO
    yeonjae.snapguide.service: WARN
    yeonjae.snapguide.repository: ERROR
    yeonjae.snapguide.controller: INFO
    org.hibernate.SQL: ERROR
    org.springframework.web: WARN

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      bucket: ${AWS_S3_BUCKET}
    region:
      static: ${AWS_REGION}
    stack:
      auto: false

server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 150
      min-spare: 30
    accept-count: 100
    connection-timeout: 20000
