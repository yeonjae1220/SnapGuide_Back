<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::body}, 'comments')}"
      lang="ko">
<body>

<h1 class="page-title">
  댓글 관리
  <span class="text-muted" style="font-size:14px; font-weight:400;"
        th:text="'(' + ${totalElements} + '개)'"></span>
</h1>

<div class="section">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>내용</th>
        <th>작성자</th>
        <th>가이드 ID</th>
        <th>액션</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${comments.empty}">
        <td colspan="5" style="text-align:center; padding:32px; color:var(--muted);">댓글이 없습니다.</td>
      </tr>
      <tr th:each="c : ${comments}">
        <td class="text-muted" th:text="${c.id}"></td>
        <td style="max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
            th:text="${c.comment}"></td>
        <td class="text-muted" th:text="${c.authorNickname ?: '-'}"></td>
        <td class="text-muted" th:text="${c.guideId ?: '-'}"></td>
        <td>
          <form class="inline-form"
                th:action="@{/admin/comments/{id}/delete(id=${c.id})}" method="post"
                onsubmit="return confirm('이 댓글을 삭제하시겠습니까?')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-danger">삭제</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" th:if="${totalPages > 1}">
    <a th:href="@{/admin/comments(p=${currentPage - 1})}"
       th:class="${currentPage == 0} ? 'disabled' : ''">&lsaquo;</a>
    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <a th:href="@{/admin/comments(p=${i})}"
         th:class="${i == currentPage} ? 'current' : ''"
         th:text="${i + 1}"></a>
    </th:block>
    <a th:href="@{/admin/comments(p=${currentPage + 1})}"
       th:class="${currentPage == totalPages - 1} ? 'disabled' : ''">&rsaquo;</a>
  </div>
</div>

</body>
</html>
