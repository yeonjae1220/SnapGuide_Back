<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::body}, 'members')}"
      lang="ko">
<body>

<h1 class="page-title">
  회원 관리
  <span class="text-muted" style="font-size:14px; font-weight:400;"
        th:text="'(' + ${totalElements} + '명)'"></span>
</h1>

<div class="section">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>이메일</th>
        <th>닉네임</th>
        <th>가입 경로</th>
        <th>가입일</th>
        <th>역할</th>
        <th>액션</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${members.empty}">
        <td colspan="7" style="text-align:center; padding:32px; color:var(--muted);">회원이 없습니다.</td>
      </tr>
      <tr th:each="m : ${members}">
        <td class="text-muted" th:text="${m.id}"></td>
        <td th:text="${m.email}"></td>
        <td style="font-weight:500;" th:text="${m.nickname}"></td>
        <td class="text-muted" th:text="${m.provider ?: 'LOCAL'}"></td>
        <td class="text-muted"
            th:text="${m.createdAt != null} ? ${#temporals.format(m.createdAt, 'yyyy-MM-dd')} : '-'"></td>
        <td>
          <span th:each="auth : ${m.authority}"
                class="badge"
                th:class="${auth.name() == 'ADMIN'} ? 'badge badge-admin' : 'badge badge-member'"
                th:text="${auth.name()}"></span>
        </td>
        <td>
          <!-- ADMIN 여부 확인 후 토글 버튼 -->
          <form class="inline-form"
                th:action="@{/admin/members/{id}/role(id=${m.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <th:block th:with="isAdmin=${m.authority != null and m.authority.contains(T(yeonjae.snapguide.domain.member.Authority).ADMIN)}">
              <input type="hidden" name="authority"
                     th:value="${isAdmin} ? 'MEMBER' : 'ADMIN'"/>
              <button type="submit" class="btn"
                      th:text="${isAdmin} ? '↓ MEMBER 강등' : '↑ ADMIN 승격'">변경</button>
            </th:block>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" th:if="${totalPages > 1}">
    <a th:href="@{/admin/members(p=${currentPage - 1})}"
       th:class="${currentPage == 0} ? 'disabled' : ''">&lsaquo;</a>
    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <a th:href="@{/admin/members(p=${i})}"
         th:class="${i == currentPage} ? 'current' : ''"
         th:text="${i + 1}"></a>
    </th:block>
    <a th:href="@{/admin/members(p=${currentPage + 1})}"
       th:class="${currentPage == totalPages - 1} ? 'disabled' : ''">&rsaquo;</a>
  </div>
</div>

</body>
</html>
