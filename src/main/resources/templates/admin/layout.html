<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, activePage)"
      lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapGuide Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
      --border: #2e3350; --accent: #6c63ff; --danger: #e05252;
      --success: #4caf7d; --warning: #f0a500;
      --text: #e8eaf0; --muted: #9ba3c0;
      --sidebar-w: 220px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; font-size: 14px; }

    #sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; }
    .logo { padding: 20px 18px 16px; font-size: 17px; font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--border); }
    .logo span { font-weight: 400; font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }
    nav { padding: 12px 0; flex: 1; }
    nav a { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-size: 13px; color: var(--muted); text-decoration: none; transition: background .15s, color .15s; }
    nav a:hover { background: var(--surface2); color: var(--text); }
    nav a.active { background: var(--surface2); color: var(--accent); }
    .sidebar-footer { padding: 16px 18px; border-top: 1px solid var(--border); }
    .sidebar-footer form button { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); padding: 8px; font-size: 12px; cursor: pointer; transition: color .15s; }
    .sidebar-footer form button:hover { color: var(--danger); }

    #main { margin-left: var(--sidebar-w); flex: 1; padding: 32px; }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

    .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; border: 1px solid; }
    .flash-success { background: rgba(76,175,125,.1); border-color: rgba(76,175,125,.3); color: var(--success); }
    .flash-error   { background: rgba(224,82,82,.1);  border-color: rgba(224,82,82,.3);  color: var(--danger); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }

    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; overflow: hidden; }
    .section-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 10px 16px; text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; background: var(--surface2); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .pagination { display: flex; gap: 6px; padding: 16px 20px; justify-content: center; }
    .pagination a, .pagination span { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; color: var(--muted); text-decoration: none; transition: all .15s; }
    .pagination a:hover { background: var(--surface2); color: var(--text); }
    .pagination .current { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pagination .disabled { pointer-events: none; opacity: .35; }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .badge-admin  { background: rgba(108,99,255,.2); color: var(--accent); }
    .badge-member { background: rgba(76,175,125,.2); color: var(--success); }

    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: none; transition: all .15s; }
    .btn:hover { color: var(--text); }
    .btn-danger { border-color: rgba(224,82,82,.4); color: var(--danger); background: transparent; }
    .btn-danger:hover { background: rgba(224,82,82,.1); }
    .inline-form { display: inline; }
    .text-muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
<div id="sidebar">
  <div class="logo">SnapGuide <span>Admin Console</span></div>
  <nav>
    <a th:href="@{/admin/dashboard}" th:class="${activePage == 'dashboard'} ? 'active' : ''">📊 대시보드</a>
    <a th:href="@{/admin/members}"   th:class="${activePage == 'members'}   ? 'active' : ''">👥 회원</a>
    <a th:href="@{/admin/guides}"    th:class="${activePage == 'guides'}    ? 'active' : ''">📖 가이드</a>
    <a th:href="@{/admin/comments}"  th:class="${activePage == 'comments'}  ? 'active' : ''">💬 댓글</a>
  </nav>
  <div class="sidebar-footer">
    <form th:action="@{/admin/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit">로그아웃</button>
    </form>
  </div>
</div>

<div id="main">
  <div th:if="${successMessage}" class="flash flash-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}"   class="flash flash-error"   th:text="${errorMessage}"></div>
  <th:block th:replace="${content}"/>
</div>
</body>
</html>
