<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::body}, 'dashboard')}"
      lang="ko">
<body>

<h1 class="page-title">대시보드</h1>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-label">전체 회원</div>
    <div class="stat-value" th:text="${stats.totalMembers}">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">전체 가이드</div>
    <div class="stat-value" th:text="${stats.totalGuides}">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">전체 댓글</div>
    <div class="stat-value" th:text="${stats.totalComments}">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">전체 위치</div>
    <div class="stat-value" th:text="${stats.totalLocations}">0</div>
  </div>
</div>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
  <div class="section" style="padding:20px;">
    <div style="font-size:13px; font-weight:600; margin-bottom:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;">빠른 이동</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <a th:href="@{/admin/members}"  class="btn" style="justify-content:flex-start;">👥 회원 관리</a>
      <a th:href="@{/admin/guides}"   class="btn" style="justify-content:flex-start;">📖 가이드 관리</a>
      <a th:href="@{/admin/comments}" class="btn" style="justify-content:flex-start;">💬 댓글 관리</a>
    </div>
  </div>
  <div class="section" style="padding:20px;">
    <div style="font-size:13px; font-weight:600; margin-bottom:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;">현황</div>
    <div style="font-size:13px; line-height:2.2; color:var(--muted);">
      <div>회원: <span style="color:var(--text); font-weight:600;" th:text="${stats.totalMembers}">0</span>명</div>
      <div>가이드: <span style="color:var(--text); font-weight:600;" th:text="${stats.totalGuides}">0</span>개</div>
      <div>댓글: <span style="color:var(--text); font-weight:600;" th:text="${stats.totalComments}">0</span>개</div>
      <div>위치: <span style="color:var(--text); font-weight:600;" th:text="${stats.totalLocations}">0</span>개</div>
    </div>
  </div>
</div>

</body>
</html>
