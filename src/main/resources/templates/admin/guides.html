<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::body}, 'guides')}"
      lang="ko">
<body>

<h1 class="page-title">
  가이드 관리
  <span class="text-muted" style="font-size:14px; font-weight:400;"
        th:text="'(' + ${totalElements} + '개)'"></span>
</h1>

<div class="section">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>내용</th>
        <th>작성자</th>
        <th>위치</th>
        <th>좋아요</th>
        <th>미디어</th>
        <th>작성일</th>
        <th>액션</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${guides.empty}">
        <td colspan="8" style="text-align:center; padding:32px; color:var(--muted);">가이드가 없습니다.</td>
      </tr>
      <tr th:each="g : ${guides}">
        <td class="text-muted" th:text="${g.id}"></td>
        <td style="max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
            th:text="${g.tip}"></td>
        <td class="text-muted" th:text="${g.authorNickname ?: '-'}"></td>
        <td class="text-muted" th:text="${g.locationName ?: '-'}"></td>
        <td class="text-muted" th:text="${g.likeCount}"></td>
        <td class="text-muted" th:text="${g.mediaCount}"></td>
        <td class="text-muted"
            th:text="${g.createdAt != null} ? ${#temporals.format(g.createdAt, 'MM-dd HH:mm')} : '-'"></td>
        <td>
          <form class="inline-form"
                th:action="@{/admin/guides/{id}/delete(id=${g.id})}" method="post"
                onsubmit="return confirm('이 가이드를 삭제하시겠습니까?')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-danger">삭제</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" th:if="${totalPages > 1}">
    <a th:href="@{/admin/guides(p=${currentPage - 1})}"
       th:class="${currentPage == 0} ? 'disabled' : ''">&lsaquo;</a>
    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <a th:href="@{/admin/guides(p=${i})}"
         th:class="${i == currentPage} ? 'current' : ''"
         th:text="${i + 1}"></a>
    </th:block>
    <a th:href="@{/admin/guides(p=${currentPage + 1})}"
       th:class="${currentPage == totalPages - 1} ? 'disabled' : ''">&rsaquo;</a>
  </div>
</div>

</body>
</html>
