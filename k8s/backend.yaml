apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapguide-uploads-pvc
  namespace: snapguide
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: snapguide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        project: snapguide
      containers:
        - name: backend
          image: ghcr.io/yeonjae1220/snapguide_back:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://db:5432/snapguide"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: JWT_SECRET
            - name: ACCESS_TOKEN_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: ACCESS_TOKEN_EXPIRATION
            - name: REFRESH_TOKEN_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: REFRESH_TOKEN_EXPIRATION
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: GOOGLE_MAPS_API_KEY
            - name: GOOGLE_MAPS_GEOCODING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: GOOGLE_MAPS_GEOCODING_API_KEY
            - name: CLOUD_AWS_CREDENTIALS_ACCESS-KEY
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: AWS_ACCESS_KEY_ID
            - name: CLOUD_AWS_CREDENTIALS_SECRET-KEY
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: CLOUD_AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: AWS_S3_BUCKET
            - name: CLOUD_AWS_REGION_STATIC
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: AWS_REGION
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD_BCRYPT
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: ADMIN_PASSWORD_BCRYPT
            # OpenTelemetry 비활성화 (관측 스택 미포함)
            - name: OTEL_SDK_DISABLED
              value: "true"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "1.5Gi"
              cpu: "1500m"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: snapguide-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: snapguide
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
