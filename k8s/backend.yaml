apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapguide-uploads-pvc
  namespace: snapguide
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: snapguide
spec:
  replicas: 1
  # strategy 를 일부러 지정하지 않는다(= RollingUpdate). RWO PVC(업로드 파일)를 쓰지만
  # GLOBAL-PIT-095 에 해당하지 않는다 — 2026-09-07 실측 근거 셋:
  #   ① 이 컨테이너는 데이터 디렉터리를 배타 락하지 않는다(postgres/minio 와 다름).
  #      구·신 파드가 잠시 함께 떠도 서로를 막지 않는다.
  #   ② local-path PV 에 spec.nodeAffinity.required 가 이미 박혀 있어, 노드가 늘어도
  #      스케줄러가 이 PVC 를 쓰는 파드를 그 노드 밖에 배치하지 못한다.
  #      따라서 파드 레벨 nodeSelector/affinity 는 같은 제약을 두 벌 적는 것이라 불필요하다.
  #   ③ 실제로 140세대까지 정상 롤아웃됐다.
  # 단일 레플리카 DB 와 달리 여기서는 RollingUpdate 가 진짜 무중단을 준다.
  # Recreate 로 바꾸면 배포마다 앱 기동 시간만큼 다운타임이 생긴다.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        project: snapguide
      containers:
        - name: backend
          image: ghcr.io/yeonjae1220/snapguide_back:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://db:5432/snapguide"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: JWT_SECRET
            - name: ACCESS_TOKEN_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: ACCESS_TOKEN_EXPIRATION
            - name: REFRESH_TOKEN_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: REFRESH_TOKEN_EXPIRATION
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: GOOGLE_MAPS_API_KEY
            - name: GOOGLE_MAPS_GEOCODING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: GOOGLE_MAPS_GEOCODING_API_KEY
            - name: CLOUD_AWS_CREDENTIALS_ACCESS-KEY
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: AWS_ACCESS_KEY_ID
            - name: CLOUD_AWS_CREDENTIALS_SECRET-KEY
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: CLOUD_AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: AWS_S3_BUCKET
            - name: CLOUD_AWS_REGION_STATIC
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: AWS_REGION
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD_BCRYPT
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: ADMIN_PASSWORD_BCRYPT
            # lab.mungji 콘솔 집계용 서비스 토큰 — 미설정 시 /api/internal/** 차단
            - name: CONSOLE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: CONSOLE_INTERNAL_TOKEN
            - name: LAB_FEEDBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: snapguide-secret
                  key: LAB_FEEDBACK_TOKEN
            # OpenTelemetry 비활성화 (관측 스택 미포함)
            - name: OTEL_SDK_DISABLED
              value: "true"
            # nginx-ingress 파드의 IP에서 온 요청만 X-Forwarded-For를 신뢰 (스푸핑 방지).
            # k3s/flannel 기본 파드 CIDR — 운영 환경에서 `kubectl get pods -n kube-system -o wide`로
            # 실제 ingress-nginx 파드 대역을 확인해 필요 시 갱신할 것 (CIDR 표기 지원).
            - name: TRUSTED_PROXY_IPS
              value: "127.0.0.1,::1,10.42.0.0/16"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "1.5Gi"
              cpu: "1500m"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: snapguide-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: snapguide
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
